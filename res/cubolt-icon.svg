<?xml version="1.0" encoding="UTF-8"?>
<!-- Cubolt application icon: parametric source.
     Geometry: 2:1 dimetric cube, edge a=128 on a 256 canvas, center (127,134).
     Bolt: outer contour traced off the original icon, expanded +2 and
     scaled 1.02 about its own center, then drawn as a lit tube rather than
     filled: a 15 wide gold wall with a 6 hot specular down its middle and
     a 24 bloom behind both, which is how the original neon mark was built.
     Both walls taper to 0.35 of full width over the last 34 units into the two
     spikes, whose tips are pinned on the traced contour, so the tube ends
     on the spike instead of capping over it.
     README.md embeds res/cubolt-icon.png, the 512x512 transparent raster rendered from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="boltGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- cube faces -->
  <g>
    <polygon points="127,6 241.49,63.24 127,120.49 12.51,63.24" fill="rgb(14,54,66)" fill-opacity="0.439"/>
    <polygon points="241.49,191.24 241.49,63.24 127,120.49 127,248.49" fill="rgb(8,36,45)" fill-opacity="0.510"/>
    <polygon points="12.51,191.24 127,248.49 127,120.49 12.51,63.24" fill="rgb(4,24,30)" fill-opacity="0.580"/>
  </g>

  <!-- cube wire: wide electric-cyan tube with a deep-teal core -->
